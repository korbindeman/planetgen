<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procedural Planet Generation</title>
    <style>
      html {
        color-scheme: light;
        background: #fff;
        color: #000;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        height: 100dvh;
        overflow: hidden;
        background: #fff;
        color: #000;
      }
      @media (prefers-color-scheme: dark) {
        html { filter: invert(1); }
        canvas { filter: invert(1); }
      }
      .controls {
        flex: 0 0 14rem;
        padding: 0.75rem 1rem;
        overflow: auto;
      }
      .controls p { margin: 0; }
      .controls input[type="range"] { width: 100%; }
      .controls #seed-input {
        width: 8em;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .controls button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #saved-seeds-popover {
        inset: auto;
        margin: 0;
        padding: 6px;
        width: 17rem;
        border: 0;
        border-radius: 12px;
        background: #fff;
        color: #000;
        font: inherit;
        -webkit-font-smoothing: antialiased;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 8px 24px rgba(0, 0, 0, 0.16);
        transform-origin: 0 0;
        opacity: 1;
        transform: scale(1);
        transition-property: opacity, transform, overlay, display;
        transition-duration: 180ms;
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        transition-behavior: allow-discrete;
      }
      #saved-seeds-popover:not(:popover-open) {
        opacity: 0;
        transform: scale(0.96);
      }
      @starting-style {
        #saved-seeds-popover:popover-open {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .saved-seeds-title {
        padding: 4px 6px 6px;
        font-weight: 600;
        font-size: 0.82rem;
      }
      #saved-seeds-form {
        display: flex;
        gap: 0.35rem;
        padding: 0 2px 8px;
        margin: 0 0 4px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      #saved-seed-name {
        flex: 1;
        min-width: 0;
        width: 0;
        font: inherit;
      }
      #saved-seeds-list {
        max-height: min(20rem, 60vh);
        overflow: auto;
      }
      .saved-seeds-empty {
        padding: 0.7rem 0.5rem;
        opacity: 0.5;
        font-size: 0.9em;
      }
      .saved-seed-row {
        display: flex;
        align-items: center;
        gap: 2px;
        border-radius: 6px;
      }
      .saved-seed-row.is-current {
        background: rgba(0, 0, 0, 0.07);
      }
      .saved-seed-item {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        margin: 0;
        padding: 0.4rem 0.5rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .saved-seed-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .saved-seed-num {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        opacity: 0.5;
      }
      .saved-seed-delete {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        opacity: 0.4;
      }
      @media (hover: hover) and (pointer: fine) {
        .saved-seed-item:hover {
          background: rgba(0, 0, 0, 0.06);
        }
        .saved-seed-delete:hover {
          opacity: 1;
          background: rgba(0, 0, 0, 0.08);
        }
      }
      .saved-seed-item:active,
      .saved-seed-delete:active {
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        #saved-seeds-popover {
          transform: none;
          transition-property: opacity, overlay, display;
          transition-duration: 120ms;
        }
        #saved-seeds-popover:not(:popover-open) {
          transform: none;
        }
        @starting-style {
          #saved-seeds-popover:popover-open {
            transform: none;
          }
        }
        .saved-seed-item:active,
        .saved-seed-delete:active {
          transform: none;
        }
      }
      figure {
        flex: 1;
        margin: 0;
        min-width: 0;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
      }
      .globe {
        position: relative;
        max-width: 100cqw;
        max-height: 100cqh;
        line-height: 0;
      }
      canvas {
        display: block;
        max-width: 100cqw;
        max-height: 100cqh;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #plate-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        pointer-events: none;
        display: none;
      }
      canvas:active {
        cursor: grabbing;
      }
      .globe-hud {
        position: absolute;
        right: 0.7rem;
        bottom: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .globe-hud-btn {
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 6px 16px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        transition-property: transform, box-shadow;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .globe-hud-btn:hover {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.1),
          0 2px 4px rgba(0, 0, 0, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.16);
      }
      .globe-hud-btn:active {
        transform: scale(0.96);
      }
      .view-reset-icon {
        display: block;
        width: 22px;
        height: 22px;
        margin: 12.5px auto 13.5px;
      }
      .north-compass-rose {
        display: block;
        width: 40px;
        height: 40px;
        margin: 4px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      @media (prefers-color-scheme: dark) {
        .globe-hud { filter: invert(1); }
      }
      body.view-equirect .globe-only {
        display: none;
      }
      body.view-equirect .north-compass {
        display: none;
      }
      body.view-equirect .icon-to-map {
        display: none;
      }
      body:not(.view-equirect) .icon-to-globe {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <p>
        View:
        <button onclick="setViewMode('globe')">Globe</button>
        <button onclick="setViewMode('equirect')">Equirect</button>
        <br>
        Draw:
        <button onclick="setDrawMode('quads')">Quads</button>
        <button onclick="setDrawMode('centroid')">Flat</button>
        <button onclick="setDrawMode('plates')">Plates</button>
        <button onclick="setDrawMode('crust')">Crust</button>
        <button onclick="setDrawMode('climate')">Climate</button>
        <br>
        <label><input type="checkbox" oninput="setDrawPlateVectors(this.checked)">Plate vectors</label>
        <label><input type="checkbox" oninput="setDrawPlateBoundaries(this.checked)">Plate boundaries</label>
        <label><input type="checkbox" oninput="setMergeOceanPlates(this.checked)">Merge ocean plates</label>
        <label><input type="checkbox" oninput="setConnectOceans(this.checked)">Connect oceans</label>
        <br>
        <label><input type="checkbox" checked oninput="setSimulateTectonics(this.checked)">Simulate tectonics</label>
        <label><input type="checkbox" checked oninput="setDetailPass(this.checked)">Detail pass</label>
        <br>
        Tectonic history (<span id="sim-steps-label">200</span> Myr):
        <input id="sim-steps" type="range" min="0" max="40" value="20" oninput="document.getElementById('sim-steps-label').textContent = this.valueAsNumber * 10; setSimSteps(this.valueAsNumber)">
        <br>
        Number of regions:
        <input type="range" min="2" max="5" step="0.001" value="4" oninput="setN(Math.pow(10, this.valueAsNumber) | 0)">
        <br>
        Number of plates:
        <input type="range" min="5" max="100" value="20" oninput="setP(this.valueAsNumber)">
        <br>
        Jitter:
        <input type="range" min="0" max="1" step="0.001" value="0.5" oninput="setJitter(this.valueAsNumber)">
        <br>
        Seed:
        <input id="seed-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="88" aria-label="Seed" onchange="setSeed(this.value)" onkeydown="if (event.key === 'Enter') this.blur()">
        <button type="button" onclick="shuffleSeed()">Shuffle</button>
        <button type="button" id="seed-undo" onclick="undoSeed()" disabled title="Undo seed (⌘Z)">Undo</button>
        <button type="button" id="seed-redo" onclick="redoSeed()" disabled title="Redo seed (⌘⇧Z)">Redo</button>
        <button type="button" id="saved-seeds-btn" popovertarget="saved-seeds-popover" aria-haspopup="dialog" aria-controls="saved-seeds-popover" aria-expanded="false" title="Saved seeds">Saved</button>
        <span class="globe-only">
        <br>
        Sphere rotation:
        <input id="sphere-rotation" type="range" min="-5" max="5" step="0.001" value="-2" oninput="setRotation(this.valueAsNumber)">
        </span>
      </p>
    </div>

    <figure>
      <div class="globe">
        <canvas id="output" width="1024" height="1024"></canvas>
        <canvas id="plate-overlay" width="1024" height="1024"></canvas>
        <div class="globe-hud">
          <button type="button" class="globe-hud-btn view-mode-toggle" title="Equirectangular map" aria-label="Equirectangular map">
            <svg class="view-reset-icon icon-to-map" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <path d="M5.5 12c2.2-3.2 3.8 3.2 6.5 0s4.3 3.2 6.5 0" fill="none" stroke="#2a2e36" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg class="view-reset-icon icon-to-globe" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <ellipse cx="12" cy="12" rx="3.2" ry="7.5" fill="none" stroke="#2a2e36" stroke-width="1.5"/>
              <path d="M4.5 12h15" stroke="#2a2e36" stroke-width="1.5"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn view-reset" title="Reset view" aria-label="Reset view">
            <svg class="view-reset-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#2a2e36" d="M12 3.6 3.2 11.2h3.1v8.2h5.1v-5.4h4.2v5.4h5.1v-8.2h3.1L12 3.6z"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn north-compass" title="Click to reorient north" aria-label="Reorient north">
            <svg class="north-compass-rose" viewBox="0 0 48 48" aria-hidden="true">
              <polygon points="24,26 19.5,36 24,45 28.5,36" fill="#c5c9d1"/>
              <polygon points="24,3 19.5,20 24,26 28.5,20" fill="#e23d2b"/>
              <text x="24" y="17.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui, sans-serif">N</text>
            </svg>
          </button>
        </div>
      </div>
    </figure>
    <div id="saved-seeds-popover" popover role="dialog" aria-labelledby="saved-seeds-title">
      <div id="saved-seeds-title" class="saved-seeds-title">Saved seeds</div>
      <form id="saved-seeds-form">
        <input id="saved-seed-name" type="text" maxlength="48" placeholder="Name (optional)" autocomplete="off" spellcheck="false" aria-label="Seed name">
        <button type="submit">Save</button>
      </form>
      <div id="saved-seeds-list"></div>
    </div>
    <script type="module" src="./planet-generation.js"></script>
  </body>
</html>
