<!doctype html>
<html lang="en" class="is-picker">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procedural Planet Generation</title>
    <!-- First paint only toggles the picker. The same keys
         `src/studio/boot.js` reads: ?project=, ?seed=, ?variant=,
         activeProject. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var project = (q.get('project') || '').trim();
          var seed = q.get('seed');
          var variant = (q.get('variant') || '').trim();
          var stored = localStorage.getItem('planetgen.activeProject');
          if (!(project || (seed != null && seed !== '') || variant || stored)) return;
          document.documentElement.classList.remove('is-picker');
        } catch (e) { /* private mode */ }
      })();
    </script>
    <style>
      html {
        color-scheme: light;
        background: #fff;
        color: #000;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        height: 100dvh;
        overflow: hidden;
        background: #fff;
        color: #000;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #workspace { display: contents; }
      html.is-picker #workspace {
        visibility: hidden;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        html { filter: invert(1); }
        canvas { filter: invert(1); }
      }
      .controls {
        flex: 0 0 14rem;
        padding: 0.75rem 1rem;
        overflow: auto;
      }
      .controls p { margin: 0; }
      .controls input[type="range"] { width: 100%; }
      .controls #seed-input {
        width: 8em;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      /* One flat paragraph of <br>s was why this read as a pile. Sections
         group by the question each answers: what planet, how am I looking at
         it, what is the model doing, which roll, how finely computed. */
      .controls { flex: 0 0 17rem; }
      .panel {
        border-top: 1px solid currentColor;
        padding: 0.6rem 0 0.7rem;
        margin: 0;
      }
      .panel:first-child { border-top: 0; padding-top: 0; }
      .panel h2, .panel summary {
        margin: 0 0 0.4rem;
        font-size: 0.75em;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        opacity: 0.6;
        cursor: default;
      }
      .panel summary { cursor: pointer; margin-bottom: 0; }
      details.panel[open] summary { margin-bottom: 0.4rem; }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        margin-bottom: 0.3rem;
      }
      .muted { opacity: 0.6; font-size: 0.8em; font-style: italic; }
      /* Checkboxes were laid out inline in flowing text, so labels broke
         mid-phrase: "Plate / boundaries". One per line, label never splits. */
      .check {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        line-height: 1.6;
      }
      .check input { margin: 0; flex: 0 0 auto; }
      /* Name on the left, value on the right, slider underneath. Every
         slider shows its number; three of them used to show nothing. */
      .field { display: block; margin: 0.35rem 0; }
      .field > span { font-size: 0.9em; }
      .field > output {
        float: right;
        font-size: 0.9em;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }
      .field > input[type="range"] { display: block; width: 100%; margin-top: 0.1rem; }
      /* Nothing showed which view or draw mode was active. */
      .row button[aria-pressed="true"] {
        font-weight: 700;
        outline: 2px solid currentColor;
        outline-offset: -2px;
      }
      .app-nav {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
        padding: 0 0 0.65rem;
        margin: 0 0 0.15rem;
      }
      .back-projects {
        position: relative;
        margin: 0;
        padding: 0.2rem 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 0.8em;
        letter-spacing: 0.02em;
        opacity: 0.55;
        cursor: pointer;
      }
      .back-projects::before {
        content: "";
        position: absolute;
        inset: -10px -8px;
        min-width: 40px;
        min-height: 40px;
      }
      .project-title {
        font-weight: 600;
        font-size: 1.05em;
        text-wrap: balance;
      }
      .pipeline { margin: 0.55rem 0 0.15rem; }
      .pipeline .param-group { margin-top: 0; }
      .pipeline-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.25rem 0.6rem;
        font-size: 0.85em;
        line-height: 1.55;
      }
      .pipeline-row .stage { min-width: 0; }
      .pipeline-row .pipeline-tail {
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        flex: 0 0 auto;
      }
      .pipeline-row .status {
        text-align: right;
        opacity: 0.7;
      }
      .pipeline-row.is-empty .stage { opacity: 0.4; }
      .pipeline-row.is-empty .status { opacity: 0.3; }
      .pipeline-row.is-later .status { opacity: 0.45; font-style: italic; }
      .pipeline-row.is-stale .status { font-style: italic; }
      .pipeline-row .pipeline-action {
        flex: 0 0 auto;
        font: inherit;
        font-size: 0.85em;
        padding: 0 0.15em;
        cursor: pointer;
      }
      #param-list { margin-top: 0.55rem; }
      /* A parameter row is [pin] name [value] over its slider. The pin is
         the whole model in one control: filled means this project decides
         the value, hollow means it is free and a shuffle may move it. */
      .param { display: block; margin: 0.4rem 0; }
      .param-head { display: flex; align-items: baseline; gap: 0.35rem; }
      .param-pin {
        flex: 0 0 auto;
        width: 1.35em;
        font: inherit;
        line-height: 1;
        padding: 0 0.15em;
        cursor: pointer;
        background: none;
        border: 0;
        opacity: 0.35;
      }
      .param-pin[aria-pressed="true"] { opacity: 1; }
      .param-name { flex: 1 1 auto; font-size: 0.9em; }
      .param.free .param-name { opacity: 0.55; }
      .param-value {
        font-size: 0.9em;
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      .param input[type="range"] { display: block; width: 100%; margin: 0.05rem 0 0; }
      .param input[type="checkbox"] { margin: 0.25rem 0 0; }
      .param-group {
        margin: 0.7rem 0 0.2rem;
        font-size: 0.72em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.45;
      }
      .controls button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #variants-popover {
        inset: auto;
        margin: 0;
        padding: 6px;
        width: 20rem;
        border: 0;
        border-radius: 12px;
        background: #fff;
        color: #000;
        font: inherit;
        -webkit-font-smoothing: antialiased;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 8px 24px rgba(0, 0, 0, 0.16);
        transform-origin: 0 0;
        opacity: 1;
        transform: scale(1);
        transition-property: opacity, transform, overlay, display;
        transition-duration: 180ms;
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        transition-behavior: allow-discrete;
      }
      #variants-popover:not(:popover-open) {
        opacity: 0;
        transform: scale(0.96);
      }
      @starting-style {
        #variants-popover:popover-open {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .variants-title {
        padding: 4px 6px 6px;
        font-weight: 600;
        font-size: 0.82rem;
      }
      #variants-form {
        display: flex;
        gap: 0.35rem;
        padding: 0 2px 8px;
        margin: 0 0 4px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      #variant-name {
        flex: 1;
        min-width: 0;
        width: 0;
        font: inherit;
      }
      #variants-list {
        max-height: min(24rem, 60vh);
        overflow: auto;
      }
      .variants-empty {
        padding: 0.7rem 0.5rem;
        opacity: 0.5;
        font-size: 0.9em;
      }
      .variant-row {
        display: flex;
        align-items: center;
        gap: 2px;
        border-radius: 6px;
      }
      .variant-row.is-current {
        background: rgba(0, 0, 0, 0.07);
      }
      .variant-row.is-committed .variant-committed {
        opacity: 1;
      }
      .variant-commit,
      .variant-committed {
        flex: 0 0 auto;
        margin: 0;
        padding: 0 0.4rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.75rem;
        line-height: 1;
        opacity: 0.45;
      }
      .variant-commit {
        cursor: pointer;
      }
      .variant-item {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0;
        padding: 0.35rem 0.4rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .variant-thumb {
        flex: 0 0 4.4rem;
        width: 4.4rem;
        height: 2.2rem;
        object-fit: cover;
        outline: 1px solid rgba(0, 0, 0, 0.1);
        outline-offset: -1px;
        background: rgba(0, 0, 0, 0.06);
      }
      .variant-meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .variant-text {
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        min-width: 0;
      }
      .variant-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .variant-seed {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        opacity: 0.5;
      }
      .variant-refine {
        display: block;
        height: 3px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .variant-refine-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.45);
      }
      .variant-edge {
        padding: 2px 0.4rem 1px;
        font-size: 0.72rem;
        line-height: 1.2;
        opacity: 0.45;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .variant-delete {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        opacity: 0.4;
      }
      @media (hover: hover) and (pointer: fine) {
        .variant-item:hover {
          background: rgba(0, 0, 0, 0.06);
        }
        .variant-delete:hover,
        .variant-commit:hover {
          opacity: 1;
          background: rgba(0, 0, 0, 0.08);
        }
      }
      .variant-item:active,
      .variant-delete:active {
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        #variants-popover {
          transform: none;
          transition-property: opacity, overlay, display;
          transition-duration: 120ms;
        }
        #variants-popover:not(:popover-open) {
          transform: none;
        }
        @starting-style {
          #variants-popover:popover-open {
            transform: none;
          }
        }
        .variant-item:active,
        .variant-delete:active {
          transform: none;
        }
      }
      figure {
        flex: 1;
        margin: 0;
        min-width: 0;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
      }
      body.search-mode figure {
        place-items: stretch;
        overflow: auto;
      }
      body.search-mode .globe { display: none; }
      #search-sheet {
        display: none;
        box-sizing: border-box;
        width: 100%;
        min-height: 100%;
        padding: 0.7rem 0.8rem 1rem;
      }
      body.search-mode #search-sheet { display: block; }
      #search-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.45rem;
      }
      @media (max-width: 1100px) {
        #search-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      .search-tile {
        position: relative;
        display: block;
        width: 100%;
        background: rgba(0, 0, 0, 0.06);
        line-height: 0;
      }
      .search-tile-face {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        line-height: 0;
        cursor: pointer;
        outline: 2px solid transparent;
        outline-offset: 1px;
      }
      .search-tile.is-pending { aspect-ratio: 2 / 1; }
      .search-tile.is-liked .search-tile-face { outline-color: currentColor; }
      .search-tile canvas {
        width: 100%;
        height: auto;
        max-width: none;
        max-height: none;
        cursor: pointer;
      }
      .search-tile-actions {
        position: absolute;
        top: 0.3rem;
        right: 0.3rem;
        display: flex;
        gap: 0.25rem;
        z-index: 1;
      }
      .search-tile-open,
      .search-tile-keep {
        margin: 0;
        padding: 0.18rem 0.42rem;
        border: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.88);
        color: #000;
        font: inherit;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.2;
        cursor: pointer;
        opacity: 0;
      }
      .search-tile:hover .search-tile-open,
      .search-tile:hover .search-tile-keep,
      .search-tile:focus-within .search-tile-open,
      .search-tile:focus-within .search-tile-keep,
      .search-tile.is-kept .search-tile-keep,
      .search-tile-open:focus-visible,
      .search-tile-keep:focus-visible {
        opacity: 1;
      }
      .search-tile.is-kept .search-tile-keep {
        background: #000;
        color: #fff;
      }
      @media (hover: none) {
        .search-tile-open,
        .search-tile-keep { opacity: 0.92; }
      }
      .search-tile-open:active,
      .search-tile-keep:active { transform: scale(0.96); }
      @media (prefers-reduced-motion: reduce) {
        .search-tile-open:active,
        .search-tile-keep:active { transform: none; }
      }
      #search-controls { margin-top: 0.55rem; }
      #search-ranges {
        margin-top: 0.35rem;
        font-size: 0.8em;
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }
      .search-range { opacity: 0.75; }
      .globe {
        position: relative;
        max-width: 100cqw;
        max-height: 100cqh;
        line-height: 0;
      }
      canvas {
        display: block;
        max-width: 100cqw;
        max-height: 100cqh;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #plate-overlay,
      #td-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        pointer-events: none;
        display: none;
      }
      #td-crop-list {
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
        margin: 0.15rem 0 0 1.25rem;
      }
      #td-crop-list .td-frame {
        font: inherit;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
      #td-crop-list .td-frame:hover { opacity: 0.7; }
      #td-crop-list .td-name {
        display: block;
        width: 100%;
        margin: 0.25rem 0 0.1rem;
        font: inherit;
      }
      #td-crop-list .td-jobs {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      #td-crop-list .td-job {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      #td-crop-list .td-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #td-crop-list .td-bar > div {
        height: 100%;
        background: #38bdf8;
        transition: width 0.3s ease-out;
      }
      canvas:active {
        cursor: grabbing;
      }
      .globe-hud {
        position: absolute;
        right: 0.7rem;
        bottom: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .globe-hud-btn {
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 6px 16px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        transition-property: transform, box-shadow;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .globe-hud-btn:hover {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.1),
          0 2px 4px rgba(0, 0, 0, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.16);
      }
      .globe-hud-btn:active {
        transform: scale(0.96);
      }
      .view-reset-icon {
        display: block;
        width: 22px;
        height: 22px;
        margin: 12.5px auto 13.5px;
      }
      .north-compass-rose {
        display: block;
        width: 40px;
        height: 40px;
        margin: 4px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      @media (prefers-color-scheme: dark) {
        .globe-hud { filter: invert(1); }
      }
      body.view-equirect .globe-only {
        display: none;
      }
      body.view-equirect .north-compass {
        display: none;
      }
      body.view-equirect .icon-to-map {
        display: none;
      }
      body:not(.view-equirect) .icon-to-globe {
        display: none;
      }
      #project-page {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        box-sizing: border-box;
        padding: 12vh 1.5rem 3rem;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
        background: #fff;
      }
      html.is-picker #project-page { display: flex; }
      .project-page-inner {
        width: min(36rem, 100%);
      }
      .project-page-inner h1 {
        margin: 0 0 0.3rem;
        font-size: 1.7rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      .project-page-lead {
        margin: 0 0 1.55rem;
        opacity: 0.55;
        font-size: 0.95em;
        text-wrap: pretty;
      }
      .project-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }
      @media (min-width: 560px) {
        .project-list { grid-template-columns: 1fr 1fr; }
      }
      .project-card {
        width: 100%;
        min-height: 40px;
        padding: 1rem 1.1rem;
        border: 0;
        border-radius: 16px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-weight: 600;
        font-size: 1.08em;
        text-align: left;
        cursor: pointer;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 8px 24px rgba(0, 0, 0, 0.06);
        transition-property: transform, box-shadow;
        transition-duration: 160ms;
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
      }
      .project-card.is-current {
        box-shadow:
          0 0 0 2px currentColor,
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 8px 24px rgba(0, 0, 0, 0.06);
      }
      @media (hover: hover) and (pointer: fine) {
        .back-projects:hover { opacity: 1; }
        .project-card:hover {
          box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.12),
            0 2px 4px rgba(0, 0, 0, 0.08),
            0 10px 28px rgba(0, 0, 0, 0.1);
        }
        .project-card.is-current:hover {
          box-shadow:
            0 0 0 2px currentColor,
            0 2px 4px rgba(0, 0, 0, 0.08),
            0 10px 28px rgba(0, 0, 0, 0.1);
        }
      }
      .back-projects:active,
      .project-card:active {
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        .project-card {
          transition-duration: 0ms;
        }
        .back-projects:active,
        .project-card:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="view-equirect">
    <!-- First paint matches the last view. Keep in step with
         VIEW_STORE_KEY / restoreViewState in planet-generation.js. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(sessionStorage.getItem('planetgen.view'));
          if (stored && stored.v === 2 && stored.viewMode === 'globe') {
            document.body.classList.remove('view-equirect');
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
    <div id="project-page">
      <div class="project-page-inner">
        <h1>Projects</h1>
        <p class="project-page-lead">Open a world to work on it.</p>
        <div id="project-list" class="project-list"></div>
      </div>
    </div>
    <div id="workspace">
    <div class="controls">
      <div class="app-nav">
        <button type="button" class="back-projects" id="back-to-projects" data-action="back-to-projects">← Projects</button>
        <span id="project-title" class="project-title"></span>
      </div>
      <details class="panel" open>
        <summary>View</summary>
        <div class="row" id="view-mode" role="group" aria-label="View">
          <button type="button" data-action="view" data-view="globe">Globe</button>
          <button type="button" data-action="view" data-view="equirect">Equirect</button>
        </div>
        <div class="row" id="draw-mode" role="group" aria-label="Draw">
          <button type="button" data-action="draw" data-draw="quads">Quads</button>
          <button type="button" data-action="draw" data-draw="centroid">Flat</button>
          <button type="button" data-action="draw" data-draw="plates">Plates</button>
          <button type="button" data-action="draw" data-draw="crust">Crust</button>
          <button type="button" data-action="draw" data-draw="climate">Climate</button>
        </div>
        <label class="check"><input type="checkbox" data-action="plate-vectors"><span>Plate vectors</span></label>
        <label class="check"><input type="checkbox" data-action="plate-boundaries"><span>Plate boundaries</span></label>
        <label class="check"><input id="td-crops-toggle" type="checkbox" data-action="td-crops"><span>TD crops</span></label>
        <div id="td-crop-list" hidden></div>
        <div class="globe-only">
          <label class="field"><span>Sphere rotation</span>
            <input id="sphere-rotation" type="range" min="-5" max="5" step="0.001" value="-2" data-action="rotation">
          </label>
        </div>
      </details>

      <details class="panel" open>
        <summary>Project</summary>
        <div class="row">
          <button type="button" id="search-start" data-action="search-start">Search</button>
          <button type="button" id="variants-btn" popovertarget="variants-popover" aria-haspopup="dialog" aria-controls="variants-popover" aria-expanded="false" title="Variants of this project">Variants</button>
          <span id="project-state" class="muted"></span>
        </div>
        <div id="project-pipeline" class="pipeline" hidden></div>
        <div id="search-controls" hidden>
          <div class="row">
            <button type="button" id="search-next" data-action="search-next">Next generation</button>
            <button type="button" id="search-back" data-action="search-back" disabled>Back</button>
            <button type="button" id="search-done" data-action="search-done">Done</button>
          </div>
          <div id="search-status" class="muted"></div>
          <div id="search-ranges"></div>
        </div>
        <!-- Generated from params.js: every exposed parameter, with a pin
             toggle. Pinned means this project decides it; free means it is
             left at its default and a shuffle may move it. -->
        <div id="param-list"></div>
      </details>

      <details class="panel" open>
        <summary>Model</summary>
        <label class="check"><input type="checkbox" data-action="simulate-tectonics" checked><span>Simulate tectonics</span></label>
        <label class="check"><input type="checkbox" data-action="detail-pass" checked><span>Detail pass</span></label>
        <label class="check"><input type="checkbox" data-action="merge-ocean-plates"><span>Merge ocean plates</span></label>
        <label class="check"><input type="checkbox" data-action="connect-oceans"><span>Connect oceans</span></label>
      </details>

      <details class="panel" open>
        <summary>Seed</summary>
        <div class="row">
          <input id="seed-input" type="text" autocomplete="off" spellcheck="false" value="1003" aria-label="Seed" data-action="seed">
          <button type="button" data-action="shuffle-seed">Shuffle</button>
        </div>
        <div class="row">
          <button type="button" id="seed-undo" data-action="undo-seed" disabled title="Undo seed (\u2318Z)">Undo</button>
          <button type="button" id="seed-redo" data-action="redo-seed" disabled title="Redo seed (\u2318\u21e7Z)">Redo</button>
        </div>
      </details>

      <!-- Mesh resolution, not geography: changing these must not change the
           planet, which is why they are not parameters. -->
      <details class="panel">
        <summary>Compute</summary>
        <label class="field"><span>Regions</span><output id="regions-label">10000</output>
          <input type="range" min="2" max="5" step="0.001" value="4" data-action="regions">
        </label>
        <label class="field"><span>Jitter</span><output id="jitter-label">0.50</output>
          <input type="range" min="0" max="1" step="0.001" value="0.5" data-action="jitter">
        </label>
      </details>
    </div>

    <figure>
      <div id="search-sheet" hidden>
        <div id="search-grid"></div>
      </div>
      <div class="globe">
        <canvas id="output" width="2048" height="1024"></canvas>
        <canvas id="td-overlay" width="2048" height="1024"></canvas>
        <canvas id="plate-overlay" width="2048" height="1024"></canvas>
        <div class="globe-hud">
          <button type="button" class="globe-hud-btn view-mode-toggle" data-action="view-toggle" title="Globe view" aria-label="Globe view">
            <svg class="view-reset-icon icon-to-map" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <path d="M5.5 12c2.2-3.2 3.8 3.2 6.5 0s4.3 3.2 6.5 0" fill="none" stroke="#2a2e36" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg class="view-reset-icon icon-to-globe" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <ellipse cx="12" cy="12" rx="3.2" ry="7.5" fill="none" stroke="#2a2e36" stroke-width="1.5"/>
              <path d="M4.5 12h15" stroke="#2a2e36" stroke-width="1.5"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn view-reset" title="Reset view" aria-label="Reset view">
            <svg class="view-reset-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#2a2e36" d="M12 3.6 3.2 11.2h3.1v8.2h5.1v-5.4h4.2v5.4h5.1v-8.2h3.1L12 3.6z"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn north-compass" title="Click to reorient north" aria-label="Reorient north">
            <svg class="north-compass-rose" viewBox="0 0 48 48" aria-hidden="true">
              <polygon points="24,26 19.5,36 24,45 28.5,36" fill="#c5c9d1"/>
              <polygon points="24,3 19.5,20 24,26 28.5,20" fill="#e23d2b"/>
              <text x="24" y="17.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui, sans-serif">N</text>
            </svg>
          </button>
        </div>
      </div>
    </figure>
    </div>
    <div id="variants-popover" popover role="dialog" aria-labelledby="variants-title">
      <div id="variants-title" class="variants-title">Lineage</div>
      <form id="variants-form">
        <input id="variant-name" type="text" maxlength="48" placeholder="Name (optional)" autocomplete="off" spellcheck="false" aria-label="Variant name">
        <button type="submit">Save</button>
      </form>
      <div id="variants-list"></div>
    </div>
    <script type="module" src="./src/planet-generation.js"></script>
  </body>
</html>
