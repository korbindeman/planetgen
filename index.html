<!doctype html>
<html lang="en" class="is-picker">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procedural Planet Generation</title>
    <!-- First paint only toggles the picker. Shipped names (thalos,
         earth) plus ?seed= / ?variant= skip it. User projects wait for
         the module to register them. Same keys as src/studio/boot.js. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var project = (q.get('project') || '').trim().toLowerCase();
          var seed = q.get('seed');
          var variant = (q.get('variant') || '').trim();
          var stored = (localStorage.getItem('planetgen.activeProject') || '').trim().toLowerCase();
          var shipped = {thalos: 1, earth: 1};
          if (!(shipped[project] || (seed != null && seed !== '') || variant || shipped[stored])) return;
          document.documentElement.classList.remove('is-picker');
        } catch (e) { /* private mode */ }
      })();
    </script>
    <style>

        display: block;

        aspect-ratio: 2 / 1;
        object-fit: fill;
      }
      .variant-history-item span {
        display: grid;
        place-items: center;
        aspect-ratio: 2 / 1;
        padding: 0.15rem;
        text-align: center;
        opacity: 0.7;
      }
      .variant-history-item.is-current {
        opacity: 1;
        box-shadow: 0 0 0 1.5px currentColor;
      }
      .variant-history-item:active {
        transform: scale(0.96);
      }
      body.search-mode #explore-root {
        min-height: 0;
        overflow: auto;
      }
      #explore-root:empty { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .sidebar-inner button,
        .btn,
        .stage-forward,
        .shell-variants,
        .combo {
          transition-duration: 0ms;
        }
        .sidebar-inner button:active,
        .btn:active,
        .stage-forward:active,
        .variant-history-item:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="view-equirect">
    <!-- First paint matches the last view. Keep in step with
         VIEW_STORE_KEY / restoreViewState in planet-generation.js. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(sessionStorage.getItem('planetgen.view'));
          if (stored && stored.v === 2 && stored.viewMode === 'globe') {
            document.body.classList.remove('view-equirect');
          }
        } catch (e) { /* private mode */ }
        try {
          var sidebar = JSON.parse(localStorage.getItem('planetgen.sidebar'));
          if (!sidebar || typeof sidebar !== 'object') return;
          if (sidebar.collapsed) document.body.classList.add('sidebar-collapsed');
          if (typeof sidebar.width === 'number' && isFinite(sidebar.width) && sidebar.width > 0) {
            document.body.style.setProperty('--sidebar-width', sidebar.width + 'px');
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
    <div id="project-page"></div>
    <div id="workspace">
    <div class="controls" id="sidebar">
      <div class="sidebar-inner" id="studio-root"></div>
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" data-action="toggle-sidebar" title="Hide sidebar ([)" aria-label="Hide sidebar" aria-controls="sidebar" aria-expanded="true">
        <i data-icon="chevron-left" class="sidebar-icon icon-hide" aria-hidden="true"></i>
        <i data-icon="chevron-right" class="sidebar-icon icon-show" aria-hidden="true"></i>
      </button>
      <div class="sidebar-resize" id="sidebar-resize" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="Sidebar width" tabindex="0"></div>
    </div>

    <figure>
      <div id="explore-root"></div>
      <div class="look-bar">
        <div class="look-row" id="draw-mode">
          <div class="look-card" role="group" aria-label="Look">
            <button type="button" data-action="draw" data-draw="quads">Surface</button>
            <button type="button" data-action="draw" data-draw="relief" title="Hillshade relief">Relief</button>
            <button type="button" data-action="draw" data-draw="climate" title="Moisture field">Climate</button>
          </div>
          <div class="look-card" role="group" aria-label="Plates">
            <button type="button" data-action="draw" data-draw="plates">Plates</button>
          </div>
          <div class="look-card" role="group" aria-label="Tiles">
            <button type="button" id="td-crops-toggle" data-action="td-crops" aria-pressed="false" disabled>Tiles</button>
          </div>
        </div>
        <div class="look-tools" id="look-tools" hidden>
          <div class="look-card look-tools-plates" role="group" aria-label="Plate paint">
            <button type="button" data-action="plate-paint" data-paint="color" title="One colour per plate">Color</button>
            <button type="button" data-action="plate-paint" data-paint="floor" title="Sea-floor age and boundary type">Floor</button>
          </div>
          <div class="look-card" role="group" aria-label="Plate layers">
            <button type="button" data-action="plate-vectors" aria-pressed="true">Motion</button>
            <button type="button" data-action="plate-boundaries" aria-pressed="true">Boundaries</button>
          </div>
        </div>
      </div>
      <div class="look-view">
        <div class="look-card" role="group" aria-label="View">
          <button type="button" data-action="view" data-view="globe">Globe</button>
          <button type="button" data-action="view" data-view="equirect" aria-pressed="true">Map</button>
        </div>
      </div>
      <div class="globe">
        <canvas id="output" width="2048" height="1024"></canvas>
        <canvas id="td-overlay" width="2048" height="1024"></canvas>
        <canvas id="plate-overlay" width="2048" height="1024"></canvas>
        <canvas id="measure-overlay" width="2048" height="1024"></canvas>
        <canvas id="sculpt-overlay" width="2048" height="1024"></canvas>
      </div>
      <div class="globe-hud">
        <div class="measure-readout" hidden>
          <span class="measure-readout-value" hidden></span>
          <span class="measure-readout-hint"></span>
        </div>
        <div class="sculpt-readout" hidden>
          <span class="sculpt-readout-value" hidden></span>
          <span class="sculpt-readout-hint"></span>
          <div class="sculpt-readout-actions">
            <button type="button" class="sculpt-undo" disabled>Undo</button>
            <button type="button" class="sculpt-redo" disabled>Redo</button>
          </div>
        </div>
        <div class="globe-hud-card" role="group" aria-label="Sculpt">
          <button type="button" class="globe-hud-btn sculpt-toggle" data-tool="coast" title="Coast (C)" aria-label="Coast" aria-pressed="false">
            <i data-icon="water" class="hud-icon" aria-hidden="true"></i>
          </button>
          <button type="button" class="globe-hud-btn sculpt-toggle" data-tool="relief" title="Relief (R)" aria-label="Relief" aria-pressed="false">
            <i data-icon="mountain" class="hud-icon" aria-hidden="true"></i>
          </button>
        </div>
        <div class="globe-hud-card" role="group" aria-label="Zoom">
          <button type="button" class="globe-hud-btn globe-hud-zoom" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" class="globe-hud-btn globe-hud-zoom" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        </div>
        <div class="globe-hud-card" role="group" aria-label="View tools">
          <button type="button" class="globe-hud-btn measure-toggle" title="Measure distance (M)" aria-label="Measure distance" aria-pressed="false">
            <i data-icon="ruler" class="hud-icon" aria-hidden="true"></i>
          </button>
          <button type="button" class="globe-hud-btn view-reset" title="Reset view" aria-label="Reset view">
            <i data-icon="house" class="hud-icon" aria-hidden="true"></i>
          </button>
          <button type="button" class="globe-hud-btn north-compass" title="Click to reorient north" aria-label="Reorient north">
            <span class="north-compass-rose">
              <i data-icon="compass" class="hud-icon" aria-hidden="true"></i>
            </span>
          </button>
        </div>
      </div>
    </figure>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="./src/planet-generation.js"></script>
  </body>
</html>
