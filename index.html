<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procedural Planet Generation</title>
    <style>
      html {
        color-scheme: light;
        background: #fff;
        color: #000;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        height: 100dvh;
        overflow: hidden;
        background: #fff;
        color: #000;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html { filter: invert(1); }
        canvas { filter: invert(1); }
      }
      .controls {
        flex: 0 0 14rem;
        padding: 0.75rem 1rem;
        overflow: auto;
      }
      .controls p { margin: 0; }
      .controls input[type="range"] { width: 100%; }
      .controls #seed-input {
        width: 8em;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      /* One flat paragraph of <br>s was why this read as a pile. Sections
         group by the question each answers: what planet, how am I looking at
         it, what is the model doing, which roll, how finely computed. */
      .controls { flex: 0 0 17rem; }
      .panel {
        border-top: 1px solid currentColor;
        padding: 0.6rem 0 0.7rem;
        margin: 0;
      }
      .panel:first-child { border-top: 0; padding-top: 0; }
      .panel h2, .panel summary {
        margin: 0 0 0.4rem;
        font-size: 0.75em;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        opacity: 0.6;
        cursor: default;
      }
      .panel summary { cursor: pointer; margin-bottom: 0; }
      details.panel[open] summary { margin-bottom: 0.4rem; }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        margin-bottom: 0.3rem;
      }
      .muted { opacity: 0.6; font-size: 0.8em; font-style: italic; }
      /* Checkboxes were laid out inline in flowing text, so labels broke
         mid-phrase: "Plate / boundaries". One per line, label never splits. */
      .check {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        line-height: 1.6;
      }
      .check input { margin: 0; flex: 0 0 auto; }
      /* Name on the left, value on the right, slider underneath. Every
         slider shows its number; three of them used to show nothing. */
      .field { display: block; margin: 0.35rem 0; }
      .field > span { font-size: 0.9em; }
      .field > output {
        float: right;
        font-size: 0.9em;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }
      .field > input[type="range"] { display: block; width: 100%; margin-top: 0.1rem; }
      /* Nothing showed which view or draw mode was active. */
      .row button[aria-pressed="true"] {
        font-weight: 700;
        outline: 2px solid currentColor;
        outline-offset: -2px;
      }
      .controls #project-select { font: inherit; max-width: 100%; }
      .pipeline { margin: 0.55rem 0 0.15rem; }
      .pipeline .param-group { margin-top: 0; }
      .pipeline-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.25rem 0.6rem;
        font-size: 0.85em;
        line-height: 1.55;
      }
      .pipeline-row .stage { min-width: 0; }
      .pipeline-row .pipeline-tail {
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        flex: 0 0 auto;
      }
      .pipeline-row .status {
        text-align: right;
        opacity: 0.7;
      }
      .pipeline-row.is-empty .stage { opacity: 0.4; }
      .pipeline-row.is-empty .status { opacity: 0.3; }
      .pipeline-row.is-later .status { opacity: 0.45; font-style: italic; }
      .pipeline-row.is-stale .status { font-style: italic; }
      .pipeline-row .pipeline-action {
        flex: 0 0 auto;
        font: inherit;
        font-size: 0.85em;
        padding: 0 0.15em;
        cursor: pointer;
      }
      #param-list { margin-top: 0.55rem; }
      /* A parameter row is [pin] name [value] over its slider. The pin is
         the whole model in one control: filled means this project decides
         the value, hollow means it is free and a shuffle may move it. */
      .param { display: block; margin: 0.4rem 0; }
      .param-head { display: flex; align-items: baseline; gap: 0.35rem; }
      .param-pin {
        flex: 0 0 auto;
        width: 1.35em;
        font: inherit;
        line-height: 1;
        padding: 0 0.15em;
        cursor: pointer;
        background: none;
        border: 0;
        opacity: 0.35;
      }
      .param-pin[aria-pressed="true"] { opacity: 1; }
      .param-name { flex: 1 1 auto; font-size: 0.9em; }
      .param.free .param-name { opacity: 0.55; }
      .param-value {
        font-size: 0.9em;
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      .param input[type="range"] { display: block; width: 100%; margin: 0.05rem 0 0; }
      .param-group {
        margin: 0.7rem 0 0.2rem;
        font-size: 0.72em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.45;
      }
      .controls button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #saved-seeds-popover {
        inset: auto;
        margin: 0;
        padding: 6px;
        width: 17rem;
        border: 0;
        border-radius: 12px;
        background: #fff;
        color: #000;
        font: inherit;
        -webkit-font-smoothing: antialiased;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 8px 24px rgba(0, 0, 0, 0.16);
        transform-origin: 0 0;
        opacity: 1;
        transform: scale(1);
        transition-property: opacity, transform, overlay, display;
        transition-duration: 180ms;
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        transition-behavior: allow-discrete;
      }
      #saved-seeds-popover:not(:popover-open) {
        opacity: 0;
        transform: scale(0.96);
      }
      @starting-style {
        #saved-seeds-popover:popover-open {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .saved-seeds-title {
        padding: 4px 6px 6px;
        font-weight: 600;
        font-size: 0.82rem;
      }
      #saved-seeds-form {
        display: flex;
        gap: 0.35rem;
        padding: 0 2px 8px;
        margin: 0 0 4px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      #saved-seed-name {
        flex: 1;
        min-width: 0;
        width: 0;
        font: inherit;
      }
      #saved-seeds-list {
        max-height: min(20rem, 60vh);
        overflow: auto;
      }
      .saved-seeds-empty {
        padding: 0.7rem 0.5rem;
        opacity: 0.5;
        font-size: 0.9em;
      }
      .saved-seed-row {
        display: flex;
        align-items: center;
        gap: 2px;
        border-radius: 6px;
      }
      .saved-seed-row.is-current {
        background: rgba(0, 0, 0, 0.07);
      }
      .saved-seed-item {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        margin: 0;
        padding: 0.4rem 0.5rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .saved-seed-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .saved-seed-num {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        opacity: 0.5;
      }
      .saved-seed-delete {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        opacity: 0.4;
      }
      @media (hover: hover) and (pointer: fine) {
        .saved-seed-item:hover {
          background: rgba(0, 0, 0, 0.06);
        }
        .saved-seed-delete:hover {
          opacity: 1;
          background: rgba(0, 0, 0, 0.08);
        }
      }
      .saved-seed-item:active,
      .saved-seed-delete:active {
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        #saved-seeds-popover {
          transform: none;
          transition-property: opacity, overlay, display;
          transition-duration: 120ms;
        }
        #saved-seeds-popover:not(:popover-open) {
          transform: none;
        }
        @starting-style {
          #saved-seeds-popover:popover-open {
            transform: none;
          }
        }
        .saved-seed-item:active,
        .saved-seed-delete:active {
          transform: none;
        }
      }
      figure {
        flex: 1;
        margin: 0;
        min-width: 0;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
      }
      body.search-mode figure {
        place-items: stretch;
        overflow: auto;
      }
      body.search-mode .globe { display: none; }
      #search-sheet {
        display: none;
        box-sizing: border-box;
        width: 100%;
        min-height: 100%;
        padding: 0.7rem 0.8rem 1rem;
      }
      body.search-mode #search-sheet { display: block; }
      #search-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.45rem;
      }
      @media (max-width: 1100px) {
        #search-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      .search-tile {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: rgba(0, 0, 0, 0.06);
        line-height: 0;
        cursor: pointer;
        outline: 2px solid transparent;
        outline-offset: 1px;
      }
      .search-tile.is-pending { aspect-ratio: 2 / 1; }
      .search-tile.is-liked { outline-color: currentColor; }
      .search-tile canvas {
        width: 100%;
        height: auto;
        max-width: none;
        max-height: none;
        cursor: pointer;
      }
      #search-controls { margin-top: 0.55rem; }
      #search-ranges {
        margin-top: 0.35rem;
        font-size: 0.8em;
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }
      .search-range { opacity: 0.75; }
      .globe {
        position: relative;
        max-width: 100cqw;
        max-height: 100cqh;
        line-height: 0;
      }
      canvas {
        display: block;
        max-width: 100cqw;
        max-height: 100cqh;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #plate-overlay,
      #td-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        pointer-events: none;
        display: none;
      }
      #td-crop-list {
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
        margin: 0.15rem 0 0 1.25rem;
      }
      #td-crop-list .td-frame {
        font: inherit;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
      #td-crop-list .td-frame:hover { opacity: 0.7; }
      #td-crop-list .td-name {
        display: block;
        width: 100%;
        margin: 0.25rem 0 0.1rem;
        font: inherit;
      }
      #td-crop-list .td-jobs {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      #td-crop-list .td-job {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      #td-crop-list .td-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #td-crop-list .td-bar > div {
        height: 100%;
        background: #38bdf8;
        transition: width 0.3s ease-out;
      }
      canvas:active {
        cursor: grabbing;
      }
      .globe-hud {
        position: absolute;
        right: 0.7rem;
        bottom: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .globe-hud-btn {
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 6px 16px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        transition-property: transform, box-shadow;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .globe-hud-btn:hover {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.1),
          0 2px 4px rgba(0, 0, 0, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.16);
      }
      .globe-hud-btn:active {
        transform: scale(0.96);
      }
      .view-reset-icon {
        display: block;
        width: 22px;
        height: 22px;
        margin: 12.5px auto 13.5px;
      }
      .north-compass-rose {
        display: block;
        width: 40px;
        height: 40px;
        margin: 4px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      @media (prefers-color-scheme: dark) {
        .globe-hud { filter: invert(1); }
      }
      body.view-equirect .globe-only {
        display: none;
      }
      body.view-equirect .north-compass {
        display: none;
      }
      body.view-equirect .icon-to-map {
        display: none;
      }
      body:not(.view-equirect) .icon-to-globe {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <details class="panel" open>
        <summary>View</summary>
        <div class="row" id="view-mode" role="group" aria-label="View">
          <button data-view="globe" onclick="setViewMode('globe')">Globe</button>
          <button data-view="equirect" onclick="setViewMode('equirect')">Equirect</button>
        </div>
        <div class="row" id="draw-mode" role="group" aria-label="Draw">
          <button data-draw="quads" onclick="setDrawMode('quads')">Quads</button>
          <button data-draw="centroid" onclick="setDrawMode('centroid')">Flat</button>
          <button data-draw="plates" onclick="setDrawMode('plates')">Plates</button>
          <button data-draw="crust" onclick="setDrawMode('crust')">Crust</button>
          <button data-draw="climate" onclick="setDrawMode('climate')">Climate</button>
        </div>
        <label class="check"><input type="checkbox" oninput="setDrawPlateVectors(this.checked)"><span>Plate vectors</span></label>
        <label class="check"><input type="checkbox" oninput="setDrawPlateBoundaries(this.checked)"><span>Plate boundaries</span></label>
        <label class="check"><input id="td-crops-toggle" type="checkbox" oninput="setTdCrops(this.checked)"><span>TD crops</span></label>
        <div id="td-crop-list" hidden></div>
        <div class="globe-only">
          <label class="field"><span>Sphere rotation</span>
            <input id="sphere-rotation" type="range" min="-5" max="5" step="0.001" value="-2" oninput="setRotation(this.valueAsNumber)">
          </label>
        </div>
      </details>

      <details class="panel" open>
        <summary>Project</summary>
        <div class="row">
          <select id="project-select" aria-label="Project" onchange="loadProject(this.value)"></select>
          <button type="button" id="search-start" onclick="enterSearch()">Search</button>
          <span id="project-state" class="muted"></span>
        </div>
        <div id="project-pipeline" class="pipeline" hidden></div>
        <div id="search-controls" hidden>
          <div class="row">
            <button type="button" id="search-next" onclick="nextSearch()">Next generation</button>
            <button type="button" id="search-back" onclick="backSearch()" disabled>Back</button>
            <button type="button" id="search-done" onclick="doneSearch()">Done</button>
          </div>
          <div id="search-status" class="muted"></div>
          <div id="search-ranges"></div>
        </div>
        <!-- Generated from params.js: every exposed parameter, with a pin
             toggle. Pinned means this project decides it; free means it is
             left at its default and a shuffle may move it. -->
        <div id="param-list"></div>
      </details>

      <details class="panel" open>
        <summary>Model</summary>
        <label class="check"><input type="checkbox" checked oninput="setSimulateTectonics(this.checked)"><span>Simulate tectonics</span></label>
        <label class="check"><input type="checkbox" checked oninput="setDetailPass(this.checked)"><span>Detail pass</span></label>
        <label class="check"><input id="polar-straits" type="checkbox" checked oninput="setPolarStraits(this.checked)"><span>Polar straits</span></label>
        <label class="check"><input type="checkbox" oninput="setMergeOceanPlates(this.checked)"><span>Merge ocean plates</span></label>
        <label class="check"><input type="checkbox" oninput="setConnectOceans(this.checked)"><span>Connect oceans</span></label>
        <label class="field"><span>Tectonic history</span><output id="sim-steps-label">200 Myr</output>
          <input id="sim-steps" type="range" min="0" max="40" value="20" oninput="setSimSteps(this.valueAsNumber)">
        </label>
      </details>

      <details class="panel" open>
        <summary>Seed</summary>
        <div class="row">
          <input id="seed-input" type="text" autocomplete="off" spellcheck="false" value="1003" aria-label="Seed" onchange="setSeed(this.value)" onkeydown="if (event.key === 'Enter') this.blur()">
          <button type="button" onclick="shuffleSeed()">Shuffle</button>
        </div>
        <div class="row">
          <button type="button" id="seed-undo" onclick="undoSeed()" disabled title="Undo seed (\u2318Z)">Undo</button>
          <button type="button" id="seed-redo" onclick="redoSeed()" disabled title="Redo seed (\u2318\u21e7Z)">Redo</button>
          <button type="button" id="saved-seeds-btn" popovertarget="saved-seeds-popover" aria-haspopup="dialog" aria-controls="saved-seeds-popover" aria-expanded="false" title="Saved seeds">Saved</button>
        </div>
      </details>

      <!-- Mesh resolution, not geography: changing these must not change the
           planet, which is why they are not parameters. -->
      <details class="panel">
        <summary>Compute</summary>
        <label class="field"><span>Regions</span><output id="regions-label">10000</output>
          <input type="range" min="2" max="5" step="0.001" value="4" oninput="setN(Math.pow(10, this.valueAsNumber) | 0); document.getElementById('regions-label').textContent = (Math.pow(10, this.valueAsNumber) | 0)">
        </label>
        <label class="field"><span>Jitter</span><output id="jitter-label">0.50</output>
          <input type="range" min="0" max="1" step="0.001" value="0.5" oninput="setJitter(this.valueAsNumber); document.getElementById('jitter-label').textContent = this.valueAsNumber.toFixed(2)">
        </label>
      </details>
    </div>

    <figure>
      <div id="search-sheet" hidden>
        <div id="search-grid"></div>
      </div>
      <div class="globe">
        <canvas id="output" width="1024" height="1024"></canvas>
        <canvas id="td-overlay" width="1024" height="1024"></canvas>
        <canvas id="plate-overlay" width="1024" height="1024"></canvas>
        <div class="globe-hud">
          <button type="button" class="globe-hud-btn view-mode-toggle" title="Equirectangular map" aria-label="Equirectangular map">
            <svg class="view-reset-icon icon-to-map" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <path d="M5.5 12c2.2-3.2 3.8 3.2 6.5 0s4.3 3.2 6.5 0" fill="none" stroke="#2a2e36" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg class="view-reset-icon icon-to-globe" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" fill="none" stroke="#2a2e36" stroke-width="1.8"/>
              <ellipse cx="12" cy="12" rx="3.2" ry="7.5" fill="none" stroke="#2a2e36" stroke-width="1.5"/>
              <path d="M4.5 12h15" stroke="#2a2e36" stroke-width="1.5"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn view-reset" title="Reset view" aria-label="Reset view">
            <svg class="view-reset-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#2a2e36" d="M12 3.6 3.2 11.2h3.1v8.2h5.1v-5.4h4.2v5.4h5.1v-8.2h3.1L12 3.6z"/>
            </svg>
          </button>
          <button type="button" class="globe-hud-btn north-compass" title="Click to reorient north" aria-label="Reorient north">
            <svg class="north-compass-rose" viewBox="0 0 48 48" aria-hidden="true">
              <polygon points="24,26 19.5,36 24,45 28.5,36" fill="#c5c9d1"/>
              <polygon points="24,3 19.5,20 24,26 28.5,20" fill="#e23d2b"/>
              <text x="24" y="17.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui, sans-serif">N</text>
            </svg>
          </button>
        </div>
      </div>
    </figure>
    <div id="saved-seeds-popover" popover role="dialog" aria-labelledby="saved-seeds-title">
      <div id="saved-seeds-title" class="saved-seeds-title">Saved seeds</div>
      <form id="saved-seeds-form">
        <input id="saved-seed-name" type="text" maxlength="48" placeholder="Name (optional)" autocomplete="off" spellcheck="false" aria-label="Seed name">
        <button type="submit">Save</button>
      </form>
      <div id="saved-seeds-list"></div>
    </div>
    <script type="module" src="./src/planet-generation.js"></script>
  </body>
</html>
