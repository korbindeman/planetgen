<!doctype html>
<html lang="en" class="is-picker">

    <title>Procedural Planet Generation</title>
    <!-- First paint only toggles the picker. The same keys
         `src/studio/boot.js` reads: ?project=, ?seed=, ?variant=,
         activeProject. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var project = (q.get('project') || '').trim();
          var seed = q.get('seed');
          var variant = (q.get('variant') || '').trim();
          var stored = localStorage.getItem('planetgen.activeProject');
          if (!(project || (seed != null && seed !== '') || variant || stored)) return;
          document.documentElement.classList.remove('is-picker');
        } catch (e) { /* private mode */ }
      })();
    </script>

        line-height: 1.2;
        cursor: pointer;
        transition-property: transform, background-color;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .look-bar button[aria-pressed="true"] {
        font-weight: 650;
        background: rgba(0, 0, 0, 0.1);
      }
      .look-bar button:active {
        transform: scale(0.96);
      }
      .look-bar .check {
        padding: 0.2rem 0.45rem;
        border-radius: 8px;
        cursor: pointer;
      }
      .look-bar :focus {
        outline: none;
      }
      .look-bar :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      @media (hover: hover) and (pointer: fine) {
        .look-bar button:hover {
          background: rgba(0, 0, 0, 0.06);
        }
        .look-bar button[aria-pressed="true"]:hover {
          background: rgba(0, 0, 0, 0.14);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .look-bar button {
          transition-duration: 0ms;
        }
        .look-bar button:active {
          transform: none;
        }
      }
      canvas {
        display: block;
        max-width: 100cqw;
        max-height: 100cqh;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #plate-overlay,
      #td-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        pointer-events: none;
        display: none;
      }
      #td-crop-list {
        display: flex;
        flex-direction: column;
        gap: 0.12rem;
        margin: 0.35rem 0 0;
      }
      #td-crop-list .td-frame {
        font: inherit;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
      #td-crop-list .td-frame:hover { opacity: 0.7; }
      #td-crop-list .td-name {
        display: block;
        width: 100%;
        margin: 0.25rem 0 0.1rem;
        font: inherit;
      }
      #td-crop-list .td-jobs {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      #td-crop-list .td-job {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      #td-crop-list .td-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #td-crop-list .td-bar > div {
        height: 100%;
        background: #38bdf8;
        transition: width 0.3s ease-out;
      }
      canvas:active {
        cursor: grabbing;
      }
      .globe-hud {
        position: absolute;
        right: 0.7rem;
        bottom: 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .globe-hud-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: #2a2e36;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.12),
          0 6px 16px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        transition-property: transform, box-shadow;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .globe-hud-btn:focus {
        outline: none;
      }
      .globe-hud-btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      .globe-hud-btn:active {
        transform: scale(0.96);
      }
      @media (hover: hover) and (pointer: fine) {
        .globe-hud-btn:hover {
          box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.1),
            0 2px 4px rgba(0, 0, 0, 0.12),
            0 8px 20px rgba(0, 0, 0, 0.16);
        }
      }
      .hud-icon {
        display: block;
        width: 22px;
        height: 22px;
      }
      .north-compass-rose {
        display: flex;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      /* Font Awesome's compass needle points NE; turn the tip to north. */
      .north-compass-rose .hud-icon {
        transform: rotate(-45deg);
      }
      @media (prefers-color-scheme: dark) {
        .globe-hud,
        .look-bar { filter: invert(1); }
      }
      body.view-equirect .globe-only {
        display: none;
      }
      body.view-equirect .north-compass {
        display: none;
      }
      body.view-equirect .icon-to-map {
        display: none;
      }
      body:not(.view-equirect) .icon-to-globe {
        display: none;
      }
      #project-page {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        box-sizing: border-box;
        padding: 12vh 1.5rem 3rem;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
        background: #fff;
      }
      html.is-picker #project-page { display: flex; }
      .project-page-inner {
        width: min(36rem, 100%);
      }
      .project-page-inner h1 {
        margin: 0 0 0.3rem;
        font-size: 1.7rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      .project-page-lead {
        margin: 0 0 1.55rem;
        opacity: 0.55;
        font-size: 0.95em;
        text-wrap: pretty;
      }
      .project-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }
      @media (min-width: 560px) {
        .project-list { grid-template-columns: 1fr 1fr; }
      }
      .project-card {
        width: 100%;
        min-height: 40px;
        padding: 1rem 1.1rem;
        border: 0;
        border-radius: 16px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-weight: 600;
        font-size: 1.08em;
        text-align: left;
        cursor: pointer;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 8px 24px rgba(0, 0, 0, 0.06);
        transition-property: transform, box-shadow;
        transition-duration: 160ms;
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
      }
      .project-card.is-current {
        box-shadow:
          0 0 0 2px currentColor,
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 8px 24px rgba(0, 0, 0, 0.06);
      }
      @media (hover: hover) and (pointer: fine) {
        .back-projects:hover { opacity: 1; }
        .project-card:hover {
          box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.12),
            0 2px 4px rgba(0, 0, 0, 0.08),
            0 10px 28px rgba(0, 0, 0, 0.1);
        }
        .project-card.is-current:hover {
          box-shadow:
            0 0 0 2px currentColor,
            0 2px 4px rgba(0, 0, 0, 0.08),
            0 10px 28px rgba(0, 0, 0, 0.1);
        }
      }
      .back-projects:active,
      .project-card:active {
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        .project-card {
          transition-duration: 0ms;
        }
        .back-projects:active,
        .project-card:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="view-equirect">
    <!-- First paint matches the last view. Keep in step with
         VIEW_STORE_KEY / restoreViewState in planet-generation.js. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(sessionStorage.getItem('planetgen.view'));
          if (stored && stored.v === 2 && stored.viewMode === 'globe') {
            document.body.classList.remove('view-equirect');
          }
        } catch (e) { /* private mode */ }
      })();
    </script>
    <div id="project-page">
      <div class="project-page-inner">
        <h1>Projects</h1>
        <p class="project-page-lead">Open a world to work on it.</p>
        <div id="project-list" class="project-list"></div>
      </div>
    </div>
    <div id="workspace">
    <div class="controls">
      <div class="panel">
        <div class="app-nav">
          <button type="button" class="back-projects" id="back-to-projects" data-action="back-to-projects">← Projects</button>
          <span id="project-title" class="project-title"></span>
        </div>
        <div class="row">
          <input id="seed-input" type="text" autocomplete="off" spellcheck="false" value="1003" aria-label="Seed" data-action="seed">
          <button type="button" data-action="shuffle-seed">Shuffle</button>
        </div>
        <div class="row">
          <button type="button" id="seed-undo" data-action="undo-seed" disabled title="Undo seed (\u2318Z)">Undo</button>
          <button type="button" id="seed-redo" data-action="redo-seed" disabled title="Redo seed (\u2318\u21e7Z)">Redo</button>
        </div>
        <div class="row">
          <button type="button" id="search-start" data-action="search-start">Explore</button>
          <button type="button" id="variants-btn" popovertarget="variants-popover" aria-haspopup="dialog" aria-controls="variants-popover" aria-expanded="false" title="Versions of this project">Versions</button>
          <span id="project-state" class="muted"></span>
        </div>
      </div>

      <div class="panel">
        <h2>Progress</h2>
        <div id="project-pipeline" class="pipeline" hidden></div>
        <div id="td-crop-list"></div>
      </div>

      <div class="panel">
        <h2>Parameters</h2>
        <!-- Generated from params.js: every exposed parameter, with a pin
             toggle. Pinned means this project decides it; free means it is
             left at its default and a shuffle may move it. -->
        <div id="param-list"></div>
      </div>

      <details class="panel">
        <summary>Advanced</summary>
        <label class="check"><input type="checkbox" data-action="simulate-tectonics" checked><span>Live tectonics</span></label>
        <label class="check"><input type="checkbox" data-action="detail-pass" checked><span>Terrain detail</span></label>
        <label class="check"><input type="checkbox" data-action="merge-ocean-plates"><span>Merge ocean plates</span></label>
        <label class="check"><input type="checkbox" data-action="connect-oceans"><span>One world ocean</span></label>
        <div class="row">
          <button type="button" data-action="draw" data-draw="centroid">Flat cells</button>
        </div>
        <div class="globe-only">
          <label class="field"><span>Spin</span>
            <input id="sphere-rotation" type="range" min="-5" max="5" step="0.001" value="-2" data-action="rotation">
          </label>
        </div>
        <!-- Mesh resolution, not geography: changing these must not change the
             planet, which is why they are not parameters. -->
        <label class="field"><span>Mesh size</span><output id="regions-label">10000</output>
          <input type="range" min="2" max="5" step="0.001" value="4" data-action="regions">
        </label>
        <label class="field"><span>Mesh jitter</span><output id="jitter-label">0.50</output>
          <input type="range" min="0" max="1" step="0.001" value="0.5" data-action="jitter">
        </label>
      </details>
    </div>

    <figure>
      <div class="explore-bar" id="search-controls" hidden>
        <div class="explore-actions">
          <button type="button" id="search-next" data-action="search-next">Next generation</button>
          <button type="button" id="search-back" data-action="search-back" disabled>Back</button>
          <button type="button" id="search-done" data-action="search-done">Done</button>
        </div>
        <div id="search-status" class="muted"></div>
      </div>
      <div id="search-sheet" hidden>
        <div id="search-grid"></div>
        <div id="search-ranges"></div>
      </div>
      <div class="look-bar">
        <div class="row" id="draw-mode" role="group" aria-label="Look">
          <button type="button" data-action="draw" data-draw="quads">Surface</button>
          <button type="button" data-action="draw" data-draw="plates">Plates</button>
          <button type="button" data-action="draw" data-draw="crust">Crust</button>
          <button type="button" data-action="draw" data-draw="climate">Climate</button>
        </div>
        <div class="row" role="group" aria-label="Overlays">
          <label class="check"><input type="checkbox" data-action="plate-vectors"><span>Motion</span></label>
          <label class="check"><input type="checkbox" data-action="plate-boundaries"><span>Boundaries</span></label>
          <label class="check"><input id="td-crops-toggle" type="checkbox" data-action="td-crops"><span>Tiles</span></label>
        </div>
      </div>
      <div class="globe">
        <canvas id="output" width="2048" height="1024"></canvas>
        <canvas id="td-overlay" width="2048" height="1024"></canvas>
        <canvas id="plate-overlay" width="2048" height="1024"></canvas>
        <div class="globe-hud">
          <button type="button" class="globe-hud-btn view-mode-toggle" data-action="view-toggle" title="Globe view" aria-label="Globe view">
            <i data-icon="map" class="hud-icon icon-to-map" aria-hidden="true"></i>
            <i data-icon="globe" class="hud-icon icon-to-globe" aria-hidden="true"></i>
          </button>
          <button type="button" class="globe-hud-btn view-reset" title="Reset view" aria-label="Reset view">
            <i data-icon="house" class="hud-icon" aria-hidden="true"></i>
          </button>
          <button type="button" class="globe-hud-btn north-compass" title="Click to reorient north" aria-label="Reorient north">
            <span class="north-compass-rose">
              <i data-icon="compass" class="hud-icon" aria-hidden="true"></i>
            </span>
          </button>
        </div>
      </div>
    </figure>
    </div>
    <div id="variants-popover" popover role="dialog" aria-labelledby="variants-title">
      <div class="versions-head">
        <div id="variants-title" class="variants-title">Versions</div>
        <div id="versions-status" class="versions-status"></div>
      </div>
      <form id="variants-form">
        <input id="variant-name" type="text" maxlength="48" placeholder="Name to branch" autocomplete="off" spellcheck="false" aria-label="Branch name">
        <button type="submit" id="variant-save" title="Save or branch (\u2318S)">Save</button>
        <p id="versions-save-hint" class="versions-hint"></p>
      </form>
      <div id="versions-compare" class="versions-compare" hidden>
        <div class="versions-compare-stage" id="versions-compare-stage">
          <img id="versions-compare-a" alt="">
          <img id="versions-compare-b" alt="">
          <input id="versions-compare-slider" type="range" min="0" max="100" value="50" aria-label="Compare versions">
        </div>
        <div class="versions-compare-labels">
          <span id="versions-compare-a-label"></span>
          <span id="versions-compare-b-label"></span>
        </div>
      </div>
      <div id="variants-list"></div>
    </div>
    <script type="module" src="./src/planet-generation.js"></script>
  </body>
</html>
